<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Messenger Redesign</title>
    
    <!-- Tailwind CDN & Fontes -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#717783",
                        "primary-container": "#1976d2",
                        "secondary-container": "#91f78e",
                        "tertiary-fixed": "#ffe170",
                        "on-tertiary-container": "#4c3e00",
                        "on-primary-container": "#fffdff",
                        "surface": "#f6faff",
                        "background": "#f6faff",
                        "primary": "#005dac",
                        "secondary": "#006e1c",
                        "on-surface": "#171c20",
                        "on-surface-variant": "#414752",
                        "error": "#ba1a1a"
                    },
                    "fontFamily": {
                        "display": ["Be Vietnam Pro"],
                        "body-sm": ["Be Vietnam Pro"],
                        "chat-text": ["Be Vietnam Pro"],
                        "body-md": ["Be Vietnam Pro"],
                        "headline-sm": ["Be Vietnam Pro"],
                        "label-bold": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"]
                    }
                },
            },
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #a5c8ff 0%, #d4e3ff 50%, #f6faff 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-window {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1), inset 0 0 0 1px rgba(255,255,255,0.3);
        }

        .gel-button {
            background: linear-gradient(to bottom, #42a5f5, #1976d2);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 2px 4px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }
        .gel-button::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 100%);
        }

        .gel-button:active {
            background: linear-gradient(to bottom, #1565c0, #1976d2);
            transform: scale(0.98);
        }

        .message-bubble-incoming {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 2px 6px rgba(0,0,0,0.03), inset 0 1px 1px rgba(255,255,255,0.8);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .message-bubble-outgoing {
            background: linear-gradient(135deg, rgba(227, 242, 253, 0.85) 0%, rgba(187, 222, 250, 0.85) 100%);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 2px 6px rgba(0,93,172,0.05), inset 0 1px 1px rgba(255,255,255,0.8);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .message-bubble-incoming:hover, .message-bubble-outgoing:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 93, 172, 0.12);
        }

        .nudge-alert {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(113, 119, 131, 0.3);
            border-radius: 10px;
        }

        .glossy-header {
            background: linear-gradient(180deg, #1e88e5 0%, #1565c0 100%);
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }
        .glossy-header::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 48%;
            background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.1) 80%, rgba(255,255,255,0) 100%);
            pointer-events: none;
            border-radius: 0 0 50% 50% / 0 0 10% 10%;
        }
        
        .frosted-sidebar {
            background: rgba(240, 244, 250, 0.4);
            backdrop-filter: blur(10px);
        }

        .glossy-pill {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
        }

        .dot-flashing {
            position: relative;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: #005dac;
            color: #005dac;
            animation: dotFlashing 1s infinite linear alternate;
            animation-delay: .5s;
        }
        .dot-flashing::before, .dot-flashing::after {
            content: '';
            display: inline-block;
            position: absolute;
            top: 0;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: #005dac;
            color: #005dac;
        }
        .dot-flashing::before {
            left: -10px;
            animation: dotFlashing 1s infinite alternate;
            animation-delay: 0s;
        }
        .dot-flashing::after {
            left: 10px;
            animation: dotFlashing 1s infinite alternate;
            animation-delay: 1s;
        }
        @keyframes dotFlashing {
            0% { background-color: #005dac; }
            50%, 100% { background-color: rgba(0, 93, 172, 0.2); }
        }
    </style>
</head>
<body class="p-4">

<!-- 1. TELA DE LOGIN -->
<div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/30 backdrop-blur-md">
    <div class="glass-window p-8 rounded-2xl w-full max-w-md shadow-2xl flex flex-col gap-4">
        <div class="flex items-center justify-center gap-2 mb-2">
            <span class="material-symbols-outlined text-primary text-4xl">forum</span>
            <h2 class="text-2xl font-bold text-primary">Entrar no Chat</h2>
        </div>
        
        <div>
            <label class="block text-xs font-bold text-on-surface-variant mb-1">Seu Apelido/Nome</label>
            <input id="login-username" type="text" placeholder="Ex: kiki" class="w-full px-4 py-2.5 rounded-xl bg-white/70 border border-white/80 focus:outline-none focus:ring-2 focus:ring-primary/40 text-sm"/>

            <label class="block text-xs font-bold text-on-surface-variant mb-1">Nome do Grupo / Sala Geral</label>
            <input id="login-group" type="text" placeholder="Ex: geral" value="geral" class="w-full px-4 py-2.5 rounded-xl bg-white/70 border border-white/80 focus:outline-none focus:ring-2 focus:ring-primary/40 text-sm"/>

        <button onclick="handleLogin()" class="gel-button w-full py-3 rounded-xl text-white font-bold text-sm shadow-lg mt-2 flex items-center justify-center gap-2">

<!-- MODAL DE AMPLIAR IMAGEM -->

<!-- 2. JANELA PRINCIPAL DO CHAT -->
<div id="app-window" class="glass-window w-full max-w-[1024px] h-[720px] rounded-xl flex flex-col overflow-hidden hidden">
    
    <!-- Header Superior -->
    <header class="glossy-header flex justify-between items-center w-full px-6 py-2 shadow-sm text-white z-10">

        </div>
        
        <div class="flex items-center gap-4 relative z-20">

                <div class="flex flex-col items-end">

            <button onclick="handleLogoff()" title="Sair da Conta" class="flex items-center gap-1 px-3 py-1 bg-red-500/80 hover:bg-red-600/90 text-white text-xs font-bold rounded-lg backdrop-blur-sm transition-all shadow-sm">

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar Esquerda -->

                        <span class="material-symbols-outlined text-2xl">person</span>
                    </div>
                    <div class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-green-500 rounded-full border-2 border-white"></div>
                </div>
                <div class="flex flex-col overflow-hidden">
                    <span id="sidebar-user-name" class="text-sm font-bold text-on-surface truncate">@usuario</span>
                    <span class="text-[10px] text-outline font-medium">Sua conta</span>
                </div>
            </div>

            <!-- Pesquisa de Usuários -->
            <div class="px-3 py-2">
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-2.5 top-1/2 -translate-y-1/2 text-outline text-sm">search</span>
                    <input id="search-users-input" oninput="filterUserList()" class="w-full pl-8 pr-2 py-1.5 text-xs rounded-xl bg-white/60 border border-white/70 focus:outline-none backdrop-blur-sm" placeholder="Buscar usuários online..." type="text"/>
                </div>
            </div>

            <!-- Lista Principal da Sidebar -->
            <div class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-4">
                <!-- Sala Principal -->

                    <h3 class="px-1 text-[10px] font-bold uppercase tracking-wider text-outline/80 mb-1">Salas Públicas</h3>

                        <div class="flex items-center gap-2.5 overflow-hidden">

                                <span class="material-symbols-outlined text-base">groups</span>
                            </div>
                            <div class="flex flex-col overflow-hidden">

                        <span id="unread-main-group" class="hidden bg-red-500 text-white text-[10px] font-extrabold px-1.5 py-0.5 rounded-full shadow-md animate-bounce">0</span>

                </div>

                <!-- Lista de Usuários Conectados / DMs -->

            <!-- Botão Logoff na Sidebar -->
            <div class="p-3 border-t border-white/30 bg-white/10">
                <button onclick="handleLogoff()" class="w-full py-2 bg-red-500/10 hover:bg-red-500/20 text-red-700 text-xs font-bold rounded-xl flex items-center justify-center gap-1 transition-colors border border-red-200">
                    <span class="material-symbols-outlined text-sm">logout</span>
                    <span>Encerrar Sessão</span>
                </button>
            </div>
        </aside>

        <!-- Área Central de Mensagens -->
        <main class="flex-1 flex flex-col bg-white/40 backdrop-blur-md relative">
            <!-- Header do Chat Atual -->
            <div class="bg-white/60 px-4 py-2 flex items-center justify-between border-b border-white/40 shadow-sm">
                <div class="flex items-center gap-2">
                    <span id="chat-type-icon" class="material-symbols-outlined text-primary text-base">forum</span>
                    <h2 id="current-chat-title-header" class="text-xs font-bold text-on-surface">Histórico de Mensagens</h2>
                </div>
                <span id="typing-indicator" class="hidden text-xs text-primary font-medium flex items-center gap-2 bg-primary/10 px-3 py-1 rounded-full border border-primary/20">

            <!-- Lista de Mensagens -->
            <div class="flex-1 p-4 space-y-3 overflow-y-auto custom-scrollbar bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]" id="chat-messages">

            <!-- Popover Emojis -->

                <button onclick="insertEmoji('😍')" class="hover:bg-black/5 p-1 rounded text-lg">😍</button>

                <button onclick="insertEmoji('👍')" class="hover:bg-black/5 p-1 rounded text-lg">👍</button>
                <button onclick="insertEmoji('🔥')" class="hover:bg-black/5 p-1 rounded text-lg">🔥</button>
                <button onclick="insertEmoji('🎉')" class="hover:bg-black/5 p-1 rounded text-lg">🎉</button>
                <button onclick="insertEmoji('❤️')" class="hover:bg-black/5 p-1 rounded text-lg">❤️</button>
                <button onclick="insertEmoji('🙏')" class="hover:bg-black/5 p-1 rounded text-lg">🙏</button>
                <button onclick="insertEmoji('🤔')" class="hover:bg-black/5 p-1 rounded text-lg">🤔</button>
                <button onclick="insertEmoji('👋')" class="hover:bg-black/5 p-1 rounded text-lg">👋</button>
                <button onclick="insertEmoji('✨')" class="hover:bg-black/5 p-1 rounded text-lg">✨</button>
            </div>

            <!-- Barra de Digitação e Ações -->
            <div class="p-4 bg-white/70 backdrop-blur-md border-t border-white/50 shadow-md">
                <div class="flex gap-2 mb-2">
                    <button onclick="sendNudge()" class="glossy-pill flex items-center gap-1 px-3 py-1 rounded-lg hover:bg-white transition-all text-xs font-bold text-on-surface-variant shadow-sm">
                        <span class="material-symbols-outlined text-sm text-amber-600">notifications</span>
                        <span>Chamar Atenção</span>
                    </button>
                    
                    <label class="glossy-pill flex items-center gap-1 px-3 py-1 rounded-lg hover:bg-white transition-all text-xs font-bold text-on-surface-variant shadow-sm cursor-pointer">
                        <span class="material-symbols-outlined text-sm">attach_file</span>
                        <span>Anexar Arquivo</span>
                        <input type="file" id="file-input" class="hidden" onchange="handleFileUpload(event)"/>

                <div class="flex items-center gap-2">
                    <div class="flex-1 relative">
                        <input id="message-input" oninput="handleTypingEvent()" class="w-full px-4 py-2.5 bg-white/60 border border-white/60 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 text-sm backdrop-blur-sm" placeholder="Digite uma mensagem..." type="text"/>

        </main>

</div>

<script>
    // =======================================================
    // 1. GERENCIADOR DE ÁUDIO DO SERVIDOR (COM FALLBACK WEB)
    // =======================================================
    const SOUNDS = {
        message: new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3'),
        nudge: new Audio('https://assets.mixkit.co/active_storage/sfx/2874/2874-preview.mp3')
    };

    function playMessageSound() {
        SOUNDS.message.currentTime = 0;
        SOUNDS.message.play().catch(() => {});
    }

    function playNudgeSound() {
        SOUNDS.nudge.currentTime = 0;
        SOUNDS.nudge.play().catch(() => {});
    }

    // =======================================================
    // 2. CONFIGURAÇÕES E ESTADO DO SUPABASE
    // =======================================================
    const SUPABASE_URL = "https://sgnygzsbgqskcftfgncj.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNnbnlnenNiZ3Fza2NmdGZnbmNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MDk3NjgsImV4cCI6MjEwMTA4NTc2OH0.oBAjEGtPZCeyjjz4aeSovvM-DKZzxIeIAHIHD79B6go"; // Insira sua chave anon do Supabase aqui
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = "";
    let mainGroup = "geral";
    let activeChatRoom = "geral";
    let activeDMTargetUser = null;
    
    let onlineUsersMap = new Map();
    let unreadCounts = new Map();
    let isInitialLoad = true;
    let typingTimeout = null;
    let presenceChannel = null;

    // =======================================================
    // 3. SESSÃO & CONEXÃO
    // =======================================================
    function checkSession() {
        const savedUser = localStorage.getItem("chat_username");
        const savedGroup = localStorage.getItem("chat_group");

        if (savedUser && savedGroup) {
            currentUser = savedUser;
            mainGroup = savedGroup;
            activeChatRoom = savedGroup;
            startChat();
        } else {
            document.getElementById("login-modal").classList.remove("hidden");
            document.getElementById("app-window").classList.add("hidden");
        }
    }

    function handleLogin() {
        const userInput = document.getElementById("login-username").value.trim();
        const groupInput = document.getElementById("login-group").value.trim();

        if (!userInput || !groupInput) {
            alert("Por favor, informe seu Nome e a Sala.");
            return;
        }

        currentUser = userInput;
        mainGroup = groupInput.toLowerCase();
        activeChatRoom = mainGroup;

        localStorage.setItem("chat_username", currentUser);
        localStorage.setItem("chat_group", mainGroup);

        document.getElementById("login-modal").classList.add("hidden");
        startChat();
    }

    function handleLogoff() {
        localStorage.removeItem("chat_username");
        localStorage.removeItem("chat_group");
        location.reload();
    }

    function startChat() {
        document.getElementById("app-window").classList.remove("hidden");

        document.getElementById("header-user-name").innerText = `@${currentUser}`;
        document.getElementById("sidebar-user-name").innerText = `@${currentUser}`;
        document.getElementById("sidebar-group-name").innerText = `Sala: ${mainGroup}`;

        updateChatHeaderUI();
        fetchMessages();
        setupRealtimeEngine();
    }

    // =======================================================
    // 4. REALTIME ENGINE & NOTIFICAÇÕES
    // =======================================================
    function setupRealtimeEngine() {
        if (presenceChannel) {
            _supabase.removeChannel(presenceChannel);
        }

        presenceChannel = _supabase.channel(`global-presence-${mainGroup}`, {
            config: { presence: { key: currentUser } }
        });

        presenceChannel
            .on('presence', { event: 'sync' }, () => {
                const state = presenceChannel.presenceState();
                onlineUsersMap.clear();

                Object.keys(state).forEach(key => {
                    const presenceEntries = state[key];
                    if (presenceEntries && presenceEntries.length > 0) {
                        const userObj = presenceEntries[0];
                        if (userObj.username && userObj.username !== currentUser) {
                            onlineUsersMap.set(userObj.username, userObj);
                        }
                    }
                });
                renderOnlineUsersList();
            })
            .on('broadcast', { event: 'typing' }, payload => {
                if (payload.payload.username !== currentUser && payload.payload.room === activeChatRoom) {
                    showTypingIndicator(payload.payload.username);
                }
            })
            .on('postgres_changes', { 
                event: 'INSERT', 
                schema: 'public', 
                table: 'mensagens'
            }, payload => {
                if (isInitialLoad) return;

                const newMsg = payload.new;
                const msgRoom = newMsg.grupo;

                if (msgRoom === activeChatRoom) {
                    renderMessage(newMsg, true);
                } else {
                    if (newMsg.usuario !== currentUser) {
                        incrementUnread(msgRoom);
                        playMessageSound();
                    }
                }
            })
            .subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    await presenceChannel.track({
                        username: currentUser,
                        onlineAt: new Date().toISOString()
                    });
                }
            });
    }

    function incrementUnread(roomName) {
        const current = unreadCounts.get(roomName) || 0;
        unreadCounts.set(roomName, current + 1);
        updateUnreadBadgesUI();
    }

    function clearUnread(roomName) {
        unreadCounts.delete(roomName);
        updateUnreadBadgesUI();
    }

    function updateUnreadBadgesUI() {
        const mainGroupUnreadBadge = document.getElementById("unread-main-group");
        const mainGroupCount = unreadCounts.get(mainGroup) || 0;

        if (mainGroupCount > 0) {
            mainGroupUnreadBadge.innerText = mainGroupCount;
            mainGroupUnreadBadge.classList.remove("hidden");
        } else {
            mainGroupUnreadBadge.classList.add("hidden");
        }

        renderOnlineUsersList();
    }

    function handleTypingEvent() {
        if (presenceChannel) {
            presenceChannel.send({
                type: 'broadcast',
                event: 'typing',
                payload: { username: currentUser, room: activeChatRoom }
            });
        }
    }

    function showTypingIndicator(username) {
        const indicator = document.getElementById("typing-indicator");
        document.getElementById("typing-username").innerText = username;
        indicator.classList.remove("hidden");

        if (typingTimeout) clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            indicator.classList.add("hidden");
        }, 2500);
    }

    // =======================================================
    // 5. NAVEGAÇÃO DE SALAS
    // =======================================================
    function getDMRoomName(userA, userB) {
        const sorted = [userA, userB].sort();
        return `dm_${sorted[0]}_${sorted[1]}`;
    }

    function startPrivateChat(targetUsername) {
        if (targetUsername === currentUser) return;

        activeDMTargetUser = targetUsername;
        activeChatRoom = getDMRoomName(currentUser, targetUsername);
        
        clearUnread(activeChatRoom);
        updateChatHeaderUI();
        fetchMessages();
        renderOnlineUsersList();
    }

    function switchToMainGroup() {
        activeDMTargetUser = null;
        activeChatRoom = mainGroup;

        clearUnread(mainGroup);
        updateChatHeaderUI();
        fetchMessages();
        renderOnlineUsersList();
    }

    function updateChatHeaderUI() {
        const isPrivate = activeDMTargetUser !== null;
        const mainBtn = document.getElementById("btn-main-room");
        const privateBadge = document.getElementById("private-badge");
        const headerTitle = document.getElementById("header-chat-title");
        const headerSub = document.getElementById("header-sub-info");
        const chatTypeIcon = document.getElementById("chat-type-icon");
        const currentChatTitleHeader = document.getElementById("current-chat-title-header");

        if (isPrivate) {
            headerTitle.innerText = `@${activeDMTargetUser}`;
            headerSub.innerText = "Conversa Privada (DM)";
            privateBadge.classList.remove("hidden");
            chatTypeIcon.innerText = "lock";
            currentChatTitleHeader.innerText = `Mensagens com @${activeDMTargetUser}`;
            
            mainBtn.className = "relative flex items-center justify-between p-2 rounded-xl bg-white/50 text-on-surface hover:bg-white/80 font-bold text-xs shadow-sm cursor-pointer transition-all";
        } else {
            headerTitle.innerText = `Sala: ${mainGroup}`;
            headerSub.innerText = "Grupo Público";
            privateBadge.classList.add("hidden");
            chatTypeIcon.innerText = "forum";
            currentChatTitleHeader.innerText = "Histórico de Mensagens";

            mainBtn.className = "relative flex items-center justify-between p-2 rounded-xl bg-primary text-white font-bold text-xs shadow-sm cursor-pointer transition-all";
        }
    }

    // =======================================================
    // 6. RENDERIZAÇÃO DA LISTA DE USUÁRIOS
    // =======================================================
    function renderOnlineUsersList() {
        const container = document.getElementById("online-users-list");
        const badge = document.getElementById("online-count-badge");
        const filterText = document.getElementById("search-users-input").value.toLowerCase();

        container.innerHTML = "";
        
        const onlineUsersArray = Array.from(onlineUsersMap.keys());
        badge.innerText = onlineUsersArray.length;

        if (onlineUsersArray.length === 0) {
            container.innerHTML = `<p class="text-[11px] text-outline italic px-1 py-2">Nenhum outro usuário online no momento.</p>`;
            return;
        }

        onlineUsersArray.forEach(username => {
            if (filterText && !username.toLowerCase().includes(filterText)) return;

            const isCurrentDM = activeDMTargetUser === username;
            const dmRoomName = getDMRoomName(currentUser, username);
            const unreadCount = unreadCounts.get(dmRoomName) || 0;

            const item = document.createElement("div");
            item.onclick = () => startPrivateChat(username);
            item.className = `flex items-center justify-between p-2 rounded-xl text-xs font-semibold cursor-pointer transition-all ${
                isCurrentDM 
                    ? 'bg-primary/15 border border-primary/30 text-primary font-bold shadow-sm' 
                    : 'hover:bg-white/60 text-on-surface border border-transparent'
            }`;

            item.innerHTML = `
                <div class="flex items-center gap-2 overflow-hidden">
                    <div class="relative flex-shrink-0">
                        <div class="w-7 h-7 rounded-lg bg-primary/10 text-primary flex items-center justify-center font-bold">
                            <span class="material-symbols-outlined text-sm">person</span>
                        </div>
                        <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-green-500 rounded-full border-2 border-white"></span>
                    </div>
                    <span class="truncate">@${escapeHtml(username)}</span>
                </div>
                <div class="flex items-center gap-1">
                    ${unreadCount > 0 ? `
                        <span class="bg-red-500 text-white text-[10px] font-extrabold px-1.5 py-0.5 rounded-full shadow-sm animate-bounce">
                            ${unreadCount}
                        </span>
                    ` : `
                        <span class="material-symbols-outlined text-sm opacity-60">chat</span>
                    `}
                </div>
            `;

            container.appendChild(item);
        });
    }

    function filterUserList() {
        renderOnlineUsersList();
    }

    // =======================================================
    // 7. MENSAGENS COM HORÁRIO E PRÉ-VISUALIZAÇÕES DE MÍDIA
    // =======================================================
    const chatContainer = document.getElementById("chat-messages");

    function getFormattedTime(dateString) {
        const date = dateString ? new Date(dateString) : new Date();
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function renderMessage(msg, isRealtime = false) {
        const isMe = msg.usuario === currentUser;
        const timeFormatted = getFormattedTime(msg.created_at);

        if (msg.texto === "__NUDGE__") {
            const nudgeDiv = document.createElement("div");
            nudgeDiv.className = "flex justify-center my-2";
            nudgeDiv.innerHTML = `
                <div class="bg-amber-200/90 text-amber-900 px-4 py-1.5 rounded-full shadow border border-amber-300 flex items-center gap-2 text-xs font-bold">
                    <span class="material-symbols-outlined text-base">notifications_active</span>
                    <span>${escapeHtml(msg.usuario)} chamou a atenção de todos!</span>
                </div>
            `;
            chatContainer.appendChild(nudgeDiv);
            scrollToBottom();

            if (isRealtime && !isMe) {
                triggerNudgeEffect();
            }
            return;
        }

        if (isRealtime && !isMe) {
            playMessageSound();
        }

        const msgWrapper = document.createElement("div");
        msgWrapper.className = `flex gap-2 ${isMe ? 'justify-end' : 'justify-start'}`;

        const bubbleClass = isMe 
            ? 'message-bubble-outgoing rounded-2xl rounded-tr-none' 
            : 'message-bubble-incoming rounded-2xl rounded-tl-none';

        msgWrapper.innerHTML = `
            ${!isMe ? `
                <div class="w-7 h-7 rounded-full bg-primary/20 text-primary flex items-center justify-center font-bold text-xs flex-shrink-0 mt-1">
                    <span class="material-symbols-outlined text-base">person</span>
                </div>
            ` : ''}
            <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} max-w-[75%]">
                <span class="text-[10px] font-bold ${isMe ? 'text-primary' : 'text-outline'} mb-0.5 px-1">${escapeHtml(msg.usuario)}</span>
                <div class="${bubbleClass} px-3.5 py-2 text-sm text-on-surface relative group">
                    <div class="pr-12 pb-1">
                        ${formatMessageContent(msg.texto)}
                    </div>
                    <span class="text-[9px] opacity-60 font-medium absolute bottom-1 right-2.5 select-none">
                        ${timeFormatted}
                    </span>
                </div>
            </div>
            ${isMe ? `
                <div class="w-7 h-7 rounded-full bg-primary text-white flex items-center justify-center font-bold text-xs flex-shrink-0 mt-1 shadow-sm">
                    <span class="material-symbols-outlined text-base">person</span>
                </div>
            ` : ''}
        `;

        chatContainer.appendChild(msgWrapper);
        scrollToBottom();
    }

    function formatMessageContent(texto) {
        if (texto.startsWith("[IMAGEM]:")) {
            const imgData = texto.replace("[IMAGEM]:", "");
            return `
                <div class="space-y-1">
                    <div class="text-[10px] font-bold opacity-70 flex items-center gap-1">
                        <span class="material-symbols-outlined text-xs">image</span> Imagem Anexada
                    </div>
                    <img src="${imgData}" onclick="openImageModal('${imgData}')" class="max-w-[220px] max-h-[180px] rounded-xl object-cover border border-white/60 shadow-sm cursor-pointer hover:scale-105 transition-transform"/>
                </div>
            `;
        }

        if (texto.startsWith("[VIDEO]:")) {
            const videoData = texto.replace("[VIDEO]:", "");
            return `
                <div class="space-y-1">
                    <div class="text-[10px] font-bold opacity-70 flex items-center gap-1">
                        <span class="material-symbols-outlined text-xs">movie</span> Vídeo Anexado
                    </div>
                    <video controls class="max-w-[240px] max-h-[180px] rounded-xl border border-white/60 shadow-sm bg-black">
                        <source src="${videoData}" type="video/mp4">
                        Seu navegador não suporta reprodução de vídeos.
                    </video>
                </div>
            `;
        }

        if (texto.startsWith("[AUDIO]:")) {
            const audioData = texto.replace("[AUDIO]:", "");
            return `
                <div class="space-y-1">
                    <div class="text-[10px] font-bold opacity-70 flex items-center gap-1">
                        <span class="material-symbols-outlined text-xs">audiotrack</span> Áudio Anexado
                    </div>
                    <audio controls class="max-w-[240px] h-10 rounded-lg">
                        <source src="${audioData}">
                        Seu navegador não suporta este áudio.
                    </audio>
                </div>
            `;
        }

        if (texto.startsWith("[ARQUIVO]:")) {
            const rawData = texto.replace("[ARQUIVO]:", "");
            const parts = rawData.split("|");
            const fileName = parts[0] || "arquivo";
            const fileData = parts[1] || "#";

            return `
                <div class="flex items-center gap-3 p-1.5 bg-white/50 rounded-xl border border-white/60 shadow-sm">
                    <div class="w-9 h-9 bg-primary/10 rounded-lg flex items-center justify-center text-primary flex-shrink-0">
                        <span class="material-symbols-outlined text-xl">description</span>
                    </div>
                    <div class="flex flex-col overflow-hidden max-w-[160px]">
                        <span class="text-xs font-bold text-on-surface truncate" title="${escapeHtml(fileName)}">${escapeHtml(fileName)}</span>
                        <span class="text-[10px] text-outline">Documento</span>
                    </div>
                    <a href="${fileData}" download="${escapeHtml(fileName)}" target="_blank" class="p-1.5 bg-primary text-white rounded-lg hover:bg-primary-container transition-colors shadow-sm ml-1" title="Baixar/Abrir">
                        <span class="material-symbols-outlined text-sm">download</span>
                    </a>
                </div>
            `;
        }

        return escapeHtml(texto);
    }

    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();

        reader.onload = function(e) {
            const fileDataBase64 = e.target.result;

            if (file.type.startsWith("image/")) {
                sendMessage(`[IMAGEM]:${fileDataBase64}`);
            } else if (file.type.startsWith("video/")) {
                sendMessage(`[VIDEO]:${fileDataBase64}`);
            } else if (file.type.startsWith("audio/")) {
                sendMessage(`[AUDIO]:${fileDataBase64}`);
            } else {
                sendMessage(`[ARQUIVO]:${file.name}|${fileDataBase64}`);
            }
        };

        reader.readAsDataURL(file);
        event.target.value = "";
    }

    function openImageModal(imgSrc) {
        document.getElementById("image-modal-img").src = imgSrc;
        document.getElementById("image-modal").classList.remove("hidden");
    }

    function closeImageModal() {
        document.getElementById("image-modal").classList.add("hidden");
    }

    function triggerNudgeEffect() {
        playNudgeSound();
        chatContainer.classList.add('nudge-alert');
        
        const flash = document.createElement('div');
        flash.className = 'fixed inset-0 bg-white/20 pointer-events-none z-50 transition-opacity duration-300';
        document.body.appendChild(flash);

        setTimeout(() => {
            chatContainer.classList.remove('nudge-alert');
            flash.style.opacity = '0';
            setTimeout(() => flash.remove(), 300);
        }, 500);
    }

    function escapeHtml(str) {
        return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }

    function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function toggleEmojiPopover() {
        document.getElementById("emoji-popover").classList.toggle("hidden");
    }

    function insertEmoji(emoji) {
        const input = document.getElementById("message-input");
        input.value += emoji;
        document.getElementById("emoji-popover").classList.add("hidden");
        input.focus();
    }

    // =======================================================
    // 8. COMUNICAÇÃO COM SUPABASE
    // =======================================================
    async function fetchMessages() {
        isInitialLoad = true;
        chatContainer.innerHTML = "";

        const { data, error } = await _supabase
            .from("mensagens")
            .select("*")
            .eq("grupo", activeChatRoom)
            .order("id", { ascending: true });

        if (error) {
            console.warn("Aviso ao buscar mensagens:", error.message);
            isInitialLoad = false;
            return;
        }

        if (data) data.forEach(msg => renderMessage(msg, false));
        isInitialLoad = false;
    }

    async function sendMessage(textToSend = null) {
        const input = document.getElementById("message-input");
        const texto = textToSend || input.value.trim();
        
        if (!texto) return;

        if (!textToSend) input.value = "";

        const payload = { 
            usuario: currentUser, 
            texto: texto, 
            grupo: activeChatRoom
        };

        const { error } = await _supabase.from("mensagens").insert([payload]);

        if (error) {
            console.warn("Aviso Supabase ao enviar. Exibindo localmente:", error.message);
            renderMessage(payload, true);
        }
    }

    async function sendNudge() {
        const payload = { 
            usuario: currentUser, 
            texto: "__NUDGE__", 
            grupo: activeChatRoom
        };

        const { error } = await _supabase.from("mensagens").insert([payload]);

        if (error) {
            renderMessage(payload, true);
        }
    }

    document.getElementById("message-input").addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
    });

    window.onload = checkSession;
</script>
</body>
</html>
